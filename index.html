    <script>
        /**
         * AUDIO EFFECTS VIA WEB AUDIO API (Zero external audio dependency)
         */
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        let audioCtx = null;

        function playSound(type) {
            try {
                if (!audioCtx) audioCtx = new AudioCtx();
                if (audioCtx.state === 'suspended') audioCtx.resume();

                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);

                if (type === 'correct') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(523.25, audioCtx.currentTime); // C5
                    osc.frequency.exponentialRampToValueAtTime(659.25, audioCtx.currentTime + 0.1); // E5
                    gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.3);
                } else if (type === 'wrong') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(220, audioCtx.currentTime); // A3
                    osc.frequency.exponentialRampToValueAtTime(130.81, audioCtx.currentTime + 0.2); // C3
                    gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.3);
                } else if (type === 'click') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(400, audioCtx.currentTime);
                    gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.05);
                }
            } catch (e) {
                // Ignore audio errors if blocked
            }
        }

        function shuffleArray(arr) {
            const array = [...arr];
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function fetchQuestionPool(topicKey, diffKey) {
            let pool = [];
            if (topicKey === 'all') {
                Object.keys(QUIZ_DATABASE).forEach(t => {
                    if (QUIZ_DATABASE[t][diffKey]) {
                        pool = pool.concat(QUIZ_DATABASE[t][diffKey]);
                    }
                });
            } else {
                if (QUIZ_DATABASE[topicKey] && QUIZ_DATABASE[topicKey][diffKey]) {
                    pool = [...QUIZ_DATABASE[topicKey][diffKey]];
                }
            }
            return pool;
        }

        function getTopicLabel(key) {
            const map = { word: '한글 단어', idiom: '사자성어', proverb: '속담', bible: '성경 단어', trivia: '일반 상식', all: '전체 주제' };
            return map[key] || '일반';
        }

        function getDiffLabel(key) {
            const map = { easy: '쉬움', medium: '보통', hard: '어려움' };
            return map[key] || '보통';
        }

        function initGame(e) {
            if(e) e.preventDefault();
            playSound('click');

            const formData = new FormData(setupForm);
            gameState.topic = formData.get('topic');
            gameState.difficulty = formData.get('difficulty');
            gameState.totalQuestionsCount = parseInt(formData.get('count'), 10);
            gameState.mode = formData.get('mode');

            let pool = fetchQuestionPool(gameState.topic, gameState.difficulty);
            if (pool.length === 0) return;

            let prepared = shuffleArray(pool);
            while (prepared.length < gameState.totalQuestionsCount) {
                prepared = prepared.concat(shuffleArray(pool));
            }
            prepared = prepared.slice(0, gameState.totalQuestionsCount);

            gameState.questions = prepared.map(q => {
                const chars = Array.from(q.word);
                const blankIndex = Math.floor(Math.random() * chars.length);
                return {
                    originalWord: q.word,
                    chars: chars,
                    blankIndex: blankIndex,
                    answer: chars[blankIndex],
                    hint: q.hint,
                    explanation: q.exp
                };
            });

            gameState.currentIndex = 0;
            gameState.score = 0;
            gameState.userAnswers = [];

            currentScoreEl.textContent = '0';
            headerStats.classList.remove('hidden');
            badgeTopic.textContent = getTopicLabel(gameState.topic);
            badgeDifficulty.textContent = getDiffLabel(gameState.difficulty);
            totalQNum.textContent = gameState.totalQuestionsCount;

            screens.start.classList.add('hidden');
            screens.game.classList.remove('hidden');
            screens.result.classList.add('hidden');

            renderQuestion();
        }

        function renderQuestion() {
            const q = gameState.questions[gameState.currentIndex];

            currentQNum.textContent = gameState.currentIndex + 1;
            const progressPercent = ((gameState.currentIndex + 1) / gameState.totalQuestionsCount) * 100;
            progressBar.style.width = `${progressPercent}%`;

            btnShowHint.classList.remove('hidden');
            textHint.classList.add('hidden');
            textHint.textContent = q.hint;
            feedbackBox.classList.add('hidden');

            wordDisplay.innerHTML = '';
            q.chars.forEach((char, idx) => {
                if (idx === q.blankIndex) {
                    const blank = document.createElement('div');
                    blank.className = "w-11 h-14 sm:w-16 sm:h-20 bg-indigo-100 border-2 border-dashed border-indigo-500 rounded-2xl flex items-center justify-center text-indigo-600 blank-box animate-pulse font-black";
                    blank.textContent = "?";
                    wordDisplay.appendChild(blank);
                } else {
                    const box = document.createElement('div');
                    box.className = "w-11 h-14 sm:w-16 sm:h-20 bg-white border-2 border-gray-200 rounded-2xl flex items-center justify-center shadow-sm font-black";
                    box.textContent = char;
                    wordDisplay.appendChild(box);
                }
            });

            if (gameState.mode === 'mcq') {
                mcqOptions.classList.remove('hidden');
                inputContainer.classList.add('hidden');
                generateMCQOptions(q.answer);
            } else {
                mcqOptions.classList.add('hidden');
                inputContainer.classList.remove('hidden');
                directInput.value = '';
                directInput.disabled = false;
                btnSubmitInput.disabled = false;
                setTimeout(() => directInput.focus(), 100);
            }
        }

        function generateMCQOptions(correctChar) {
            mcqOptions.innerHTML = '';
            const distractors = new Set();
            while (distractors.size < 3) {
                const randChar = KOREAN_CHAR_POOL[Math.floor(Math.random() * KOREAN_CHAR_POOL.length)];
                if (randChar !== correctChar) {
                    distractors.add(randChar);
                }
            }

            const options = shuffleArray([correctChar, ...Array.from(distractors)]);

            options.forEach(opt => {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = "py-3.5 px-3 bg-gray-50 hover:bg-indigo-50 border-2 border-gray-200 hover:border-indigo-400 rounded-2xl font-bold text-xl sm:text-2xl text-gray-800 transition active:scale-95 shadow-sm flex items-center justify-center";
                btn.textContent = opt;
                btn.addEventListener('click', () => {
                    playSound('click');
                    handleAnswerSubmit(opt);
                });
                mcqOptions.appendChild(btn);
            });
        }

        function handleAnswerSubmit(userAns) {
            const q = gameState.questions[gameState.currentIndex];
            const isCorrect = userAns.trim() === q.answer;

            gameState.userAnswers.push({
                question: q.originalWord,
                userAns: userAns,
                correctAns: q.answer,
                isCorrect: isCorrect,
                explanation: q.explanation
            });

            if (isCorrect) {
                playSound('correct');
                gameState.score += 10;
                currentScoreEl.textContent = gameState.score;
            } else {
                playSound('wrong');
                quizCard.classList.add('shake');
                setTimeout(() => quizCard.classList.remove('shake'), 400);
            }

            wordDisplay.innerHTML = '';
            q.chars.forEach((char, idx) => {
                const box = document.createElement('div');
                if (idx === q.blankIndex) {
                    box.className = isCorrect 
                        ? "w-11 h-14 sm:w-16 sm:h-20 bg-emerald-500 text-white font-black rounded-2xl flex items-center justify-center shadow-md pop-in"
                        : "w-11 h-14 sm:w-16 sm:h-20 bg-rose-500 text-white font-black rounded-2xl flex items-center justify-center shadow-md pop-in";
                    box.textContent = q.answer;
                } else {
                    box.className = "w-11 h-14 sm:w-16 sm:h-20 bg-white border-2 border-gray-200 font-black rounded-2xl flex items-center justify-center shadow-sm";
                    box.textContent = char;
                }
                wordDisplay.appendChild(box);
            });

            if (gameState.mode === 'mcq') {
                const btns = mcqOptions.querySelectorAll('button');
                btns.forEach(b => {
                    b.disabled = true;
                    b.classList.add('opacity-50', 'cursor-not-allowed');
                });
            } else {
                directInput.disabled = true;
                btnSubmitInput.disabled = true;
            }

            feedbackBox.classList.remove('hidden', 'bg-emerald-50', 'bg-rose-50', 'border-emerald-200', 'border-rose-200');
            
            if (isCorrect) {
                feedbackBox.classList.add('bg-emerald-50', 'border', 'border-emerald-200');
                feedbackResult.className = "text-emerald-600 font-bold text-base sm:text-xl";
                feedbackResult.innerHTML = '<i class="fa-solid fa-circle-check mr-1.5"></i>정답입니다!';
            } else {
                feedbackBox.classList.add('bg-rose-50', 'border', 'border-rose-200');
                feedbackResult.className = "text-rose-600 font-bold text-base sm:text-xl";
                feedbackResult.innerHTML = `<i class="fa-solid fa-circle-xmark mr-1.5"></i>오답입니다. (정답: ${q.answer})`;
            }

            feedbackExplanation.textContent = q.explanation;
        }

        function nextQuestion() {
            playSound('click');
            if (gameState.currentIndex + 1 < gameState.totalQuestionsCount) {
                gameState.currentIndex++;
                renderQuestion();
            } else {
                renderResultScreen();
            }
        }

        function renderResultScreen() {
            screens.game.classList.add('hidden');
            screens.result.classList.remove('hidden');

            const total = gameState.totalQuestionsCount;
            const correctCount = gameState.userAnswers.filter(a => a.isCorrect).length;
            const wrongCount = total - correctCount;
            const accuracy = Math.round((correctCount / total) * 100);

            resScore.textContent = gameState.score;
            resCorrect.textContent = correctCount;
            resTotal.textContent = total;
            resWrong.textContent = wrongCount;
            resAccuracy.textContent = accuracy;

            reviewList.innerHTML = '';
            gameState.userAnswers.forEach((ans, idx) => {
                const item = document.createElement('div');
                item.className = ans.isCorrect 
                    ? "p-2.5 bg-emerald-50 border border-emerald-200 rounded-xl flex flex-col gap-0.5"
                    : "p-2.5 bg-rose-50 border border-rose-200 rounded-xl flex flex-col gap-0.5";
                
                item.innerHTML = `
                    <div class="flex items-center justify-between font-bold">
                        <span class="text-gray-800">${idx + 1}. ${ans.question}</span>
                        <span class="${ans.isCorrect ? 'text-emerald-600' : 'text-rose-600'}">
                            ${ans.isCorrect ? '정답' : `오답 (제출: ${ans.userAns || '없음'} / 정답: ${ans.correctAns})`}
                        </span>
                    </div>
                    <div class="text-[11px] sm:text-xs text-gray-600">${ans.explanation}</div>
                `;
                reviewList.appendChild(item);
            });
        }

        setupForm.addEventListener('submit', initGame);

        btnShowHint.addEventListener('click', () => {
            playSound('click');
            btnShowHint.classList.add('hidden');
            textHint.classList.remove('hidden');
        });

        btnSubmitInput.addEventListener('click', () => {
            const val = directInput.value.trim();
            if (!val) return;
            handleAnswerSubmit(val);
        });

        directInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                const val = directInput.value.trim();
                if (!val) return;
                handleAnswerSubmit(val);
            }
        });

        btnNextQuestion.addEventListener('click', nextQuestion);

        btnRestart.addEventListener('click', (e) => {
            initGame(e);
        });

        btnHome.addEventListener('click', () => {
            playSound('click');
            screens.result.classList.add('hidden');
            screens.game.classList.add('hidden');
            screens.start.classList.remove('hidden');
            headerStats.classList.add('hidden');
        });

    </script>
</body>
</html>
